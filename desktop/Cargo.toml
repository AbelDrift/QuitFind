[package]
name = "findhub-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkers = "0.66"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# QuitFind: FMD protocol v2 (argon2, hkdf, aes-gcm) and HTTP to the server
aes-gcm = "0.10.3"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10"

# Argon2 with 128 MiB is many seconds slow without optimisation, also in debug builds
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev]
debug = "line-tables-only" # smaller debug binary; linking is the RAM peak on this PC
